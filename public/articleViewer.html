<html>

<head>
    <meta name="title" content="SUCK MY BALL (DOT) BIZ (SLASH) ARTICLE - VIEWER">
    <meta name="description" content="READ IT.">
    <meta name="keywords" content="article,balls,biz">
    <meta name="robots" content="index, follow">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="language" content="English">

    <style>
        /* Work around for marked.js */
        *:not(#spanContent, #spanContent *) {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
            z-index: 0;
        }

        * {
            font-family: Arial, Helvetica, sans-serif;
        }

        p {
            font-size: 1.5em;
        }

        h3 {
            font-size: 2em;
        }

        h2 {
            font-size: 2.5em;
        }

        h1 {
            font-size: 3em;
        }

        html body {
            width: 100%;
        }

        .containerDiv {
            width: 100%;
            min-height: 100%;
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            flex-wrap: nowrap;
            flex-direction: column;
            background: black;
        }

        #divContent {
            margin: 2vw;
            color: white;
            height: 50%;
            width: 100%;
            overflow-y: scroll;
        }

        #spanContent {
            color: white;
            margin: auto;
            padding: 2em;
        }

        #header {
            width: 100%;
            padding: 1em;
            display: flex;
            justify-content: space-evenly;
        }

        #header>button {
            border: 2px yellow solid;
            background: black;
            padding: 1em;
            color: yellow;
            font-weight: bolder;
        }

        #header>button:hover {
            background: yellow;
            color: black;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>

    <meta name="google-adsense-account" content="ca-pub-2912509706983872">
</head>

<body>
    <div class="containerDiv">
        <div id="header">
            <button id="backButton">Back</button>
            <button id="fullscreenBtn">View Article In Fullscreen</button>

        </div>
        <span style="display:block" id="spanContent">
            Loading article...
        </span>
    </div>

    <script defer>
        marked.use({
            breaks: true,
            gfm: true
        });

        const backButton = document.getElementById("backButton");
        backButton.onclick = () => {
            window.location.href = "/news"
        }

        const fullscreenBtn = document.getElementById("fullscreenBtn");
        fullscreenBtn.onclick = () => {
            if (!document.fullscreenElement) {
                content.requestFullscreen()
                    .catch((err) => {
                        console.error(`Error attempting to enable fullscreen: ${err.message}`);
                    });
            } else {
                document.exitFullscreen();
            }
        };


        const content = document.getElementById("spanContent");
        const v = (new URLSearchParams(window.location.search)).get("v")
        if (!v) {
            content.innerText("Error loading article")
        } else {
            fetch(`/news-articles/${v}`).then(res => res.text()).then(txt => content.innerHTML = marked.parse(txt));
        }




    </script>
</body>

</html>
